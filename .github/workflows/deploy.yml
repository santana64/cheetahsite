name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Build static export
        run: npx next build
        env:
          NEXT_PUBLIC_BASE_PATH: /site-vitrine
          NEXT_PUBLIC_SITE_URL: https://santana64.github.io/site-vitrine
          # Clé d'accès Web3Forms du formulaire de contact. Déclarée en
          # variable de dépôt et non en secret : elle est publique par
          # conception et finit de toute façon dans le bundle client.
          # Settings → Secrets and variables → Actions → Variables.
          # Si elle n'est pas définie, le formulaire reste fonctionnel et
          # bascule sur la messagerie du visiteur, en l'annonçant.
          NEXT_PUBLIC_FORM_ACCESS_KEY: ${{ vars.NEXT_PUBLIC_FORM_ACCESS_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
